<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pack View</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pack View">
<style>
  :root{
    --bg:#0f172a;
    --card:#1a2438;
    --card2:#212d47;
    --accent:#38bdf8;
    --accent2:#0ea5e9;
    --danger:#f87171;
    --warn:#fbbf24;
    --ok:#4ade80;
    --text:#e5edf7;
    --sub:#8b9bb8;
    --border:#2a3654;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{height:100%;overflow-x:hidden;width:100%;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;
    background:var(--bg);
    color:var(--text);
    overscroll-behavior:none;
    padding-top:env(safe-area-inset-top);
    padding-bottom:env(safe-area-inset-bottom);
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
  header{
    padding:18px 20px 10px;
    display:flex;align-items:center;justify-content:space-between;
  }
  header h1{font-size:18px;margin:0;font-weight:600;letter-spacing:.02em;display:flex;align-items:center;gap:8px;}
  header .logo-dot{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%, #fca5a5, #f87171);flex-shrink:0;}
  header .date{color:var(--text);font-size:14px;font-weight:600;}
  main{flex:1;padding:0 16px 130px;overflow-y:auto;}
  .view{display:none;}
  .view.active{display:block;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    margin-bottom:14px;
  }
  .banner{
    background:linear-gradient(135deg,#3a2a1a,#4a2f1a);
    border:1px solid #6b4a1f;
    color:#ffd58a;
    border-radius:14px;
    padding:14px 16px;
    margin-bottom:14px;
    font-size:14px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
  }
  .banner button{
    background:#ffd58a;color:#3a2a1a;border:none;border-radius:10px;
    padding:8px 12px;font-size:13px;font-weight:600;white-space:nowrap;
  }
  .banner.danger{
    background:linear-gradient(135deg,#3a1a1a,#4a1a1f);
    border-color:#6b1f2f;
    color:#ffb3c0;
  }

  .stat-row{display:flex;gap:12px;}
  .stat{flex:1;text-align:center;}
  .stat .num{font-size:30px;font-weight:700;line-height:1.1;}
  .stat .label{font-size:12px;color:var(--sub);margin-top:4px;}

  .counter-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 6px;}
  .count-big{font-size:64px;font-weight:800;letter-spacing:-.02em;}
  .count-sub{color:var(--sub);font-size:13px;margin-top:-4px;}
  .tap-card{position:relative;min-height:270px;}
  .tap-wrap{position:relative;margin-top:-8px;width:187px;height:187px;}
  .adjust-btn{
    position:absolute;top:169px;width:70px;height:70px;border-radius:50%;
    background:#ffe14d;border:none;color:#3a2a00;
    font-size:29px;font-weight:800;display:flex;align-items:center;justify-content:center;
    z-index:2;box-shadow:0 6px 16px rgba(255,225,77,.35);
  }
  .adjust-plus{right:11px;}
  .adjust-reset{
    left:11px;background:var(--card2);border:2px solid var(--danger);color:var(--danger);
    font-size:12px;font-weight:800;letter-spacing:.02em;box-shadow:none;
  }
  .minus-sign{display:inline-block;transform:scaleX(2);}
  .tap-btn{
    margin-top:0;
    width:187px;height:187px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #fca5a5, #f87171);
    border:none;color:#4a1414;font-size:20px;font-weight:700;
    box-shadow:0 10px 30px rgba(248,113,113,.22);
    display:flex;align-items:center;justify-content:center;flex-direction:column;
    user-select:none;
  }
  .tap-btn:active{transform:scale(.96);}
  .tap-btn.disabled{
    background:#2a3654;color:var(--sub);box-shadow:none;
  }
  .tap-btn .plus{font-size:90px;line-height:1;font-family:'Helvetica Neue',Helvetica,sans-serif;font-weight:700;}
  .undo-btn{
    margin-top:16px;
    background:transparent;border:1px solid var(--border);color:var(--sub);
    padding:9px 18px;border-radius:20px;font-size:13px;
  }

  .row-between{display:flex;align-items:center;justify-content:space-between;}
  .section-title{font-size:14px;color:var(--sub);margin:0 0 10px;font-weight:600;}
  .pack-remaining{display:flex;align-items:center;gap:14px;}
  .pack-remaining .val{font-size:34px;font-weight:700;}
  .pack-remaining .of{color:var(--sub);font-size:14px;}
  .icon-btn{
    background:var(--card2);border:1px solid var(--border);color:var(--text);
    width:34px;height:34px;border-radius:10px;font-size:16px;display:flex;
    align-items:center;justify-content:center;
  }
  .newpack-btn{
    margin-top:12px;width:100%;background:var(--card2);border:1px solid var(--border);
    color:var(--accent);padding:11px;border-radius:12px;font-size:14px;font-weight:600;
  }
  .primary-btn{
    background:var(--accent);border:none;color:#08202f;
  }
  .stat .num.accent{color:var(--accent);}
  .remain-grid{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-top:14px;}
  .remain-grid .dot{
    width:100%;aspect-ratio:1/1;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:800;
  }
  .remain-grid .dot.used{background:var(--danger);color:transparent;}
  .remain-grid .dot.remaining{background:var(--accent);color:transparent;}
  .remain-grid .dot.empty{background:var(--sub);opacity:.35;color:transparent;}
  .pack-history{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .pack-history .box{
    width:38px;height:38px;border-radius:8px;background:var(--danger);
    border:1px solid var(--danger);display:flex;align-items:center;justify-content:center;
    font-size:21px;font-weight:800;color:#2f0808;flex-shrink:0;
    font-family:'Helvetica Neue',Helvetica,sans-serif;
  }
  .pack-history .box.blank{background:var(--card2);border:1px solid var(--border);color:transparent;}
  .pack-history .box.remain-box{background:var(--accent);border:1px solid var(--accent);color:#062033;margin-left:auto;}
  .check-line{margin-top:12px;font-size:13px;color:var(--sub);line-height:1.6;}
  .check-line b{color:var(--text);}
  .check-warn{color:var(--warn);}
  .check-danger{color:var(--danger);}
  .check-ok{color:var(--ok);}

  /* calendar */
  .cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
  .cal-header .title{font-size:16px;font-weight:700;}
  .cal-header button{background:var(--card2);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:16px;}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .cal-dow{text-align:center;font-size:11px;color:var(--sub);padding-bottom:4px;}
  .cal-cell{
    aspect-ratio:1/1;border-radius:10px;background:var(--card);border:1px solid var(--border);
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;
    position:relative;
  }
  .cal-cell.empty{background:transparent;border:none;}
  .cal-cell .d{font-size:11px;color:var(--sub);position:absolute;top:4px;left:6px;}
  .cal-cell .c{font-size:16px;font-weight:700;margin-top:6px;}
  .cal-cell.today{border-color:var(--accent);}
  .cal-cell.over-goal .c{color:var(--danger);}
  .cal-stats{font-size:12px;color:var(--sub);margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
  .cal-stats b{color:var(--text);font-size:14px;}

  /* settings */
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--sub);margin-bottom:8px;}
  .field .stepper{display:flex;align-items:center;gap:14px;}
  .field .stepper .n{font-size:26px;font-weight:700;min-width:52px;text-align:center;}
  .field .stepper button{width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:18px;}
  .field input[type=number]{width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);font-size:18px;padding:10px 14px;border-radius:10px;}
  .chart-bar{fill:var(--accent);}
  .chart-bar.over{fill:var(--danger);}

  nav{
    position:fixed;bottom:0;left:0;right:0;
    background:rgba(15,23,42,.92);backdrop-filter:blur(10px);
    border-top:1px solid var(--border);
    display:flex;justify-content:center;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav .inner{max-width:480px;width:100%;display:flex;}
  nav button{
    flex:1;background:none;border:none;color:var(--sub);padding:12px 0 10px;
    font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;
  }
  nav button .ic{font-size:20px;}
  nav button.active{color:var(--accent);}

  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;
    align-items:flex-end;justify-content:center;z-index:50;
  }
  .modal-bg.show{display:flex;}
  .modal{
    position:relative;background:var(--card);border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));
    width:100%;max-width:480px;max-height:80vh;overflow-y:auto;border:1px solid var(--border);border-bottom:none;
  }
  .modal h3{margin:0 0 14px;font-size:16px;}
  .modal input[type=number]{
    width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text);
    font-size:22px;padding:12px 14px;border-radius:12px;text-align:center;margin-bottom:14px;
  }
  .modal .btns{display:flex;gap:10px;}
  .modal .btns button{
    flex:1;padding:13px;border-radius:12px;border:none;font-size:15px;font-weight:600;
  }
  .modal .btns .cancel{background:var(--card2);color:var(--text);}
  .modal .btns .save{background:var(--accent);color:#08202f;}
  .close-x{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--sub);font-size:20px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1><span class="logo-dot"></span>Pack View</h1>
    <div class="date" id="headerDate"></div>
  </header>

  <main>
    <!-- HOME -->
    <section class="view active" id="view-home">
      <div id="homeBanner"></div>

      <div class="card">
        <div class="remain-grid" id="remainGrid"></div>
        <div class="pack-history" id="packHistory"></div>
        <span id="startRemainVal" style="display:none;"></span>
        <span id="remainVal" style="display:none;"></span>
        <span id="packSizeVal" style="display:none;"></span>
      </div>

      <div class="card tap-card">
        <button class="adjust-btn adjust-plus" id="minusBtn"><span class="minus-sign">−</span></button>
        <button class="adjust-btn adjust-reset" id="resetBtn">RESET</button>
        <div class="counter-wrap">
          <span id="todayCount" style="display:none;"></span>
          <div class="tap-wrap">
            <button class="tap-btn" id="tapBtn">
              <span class="plus" id="tapBtnCount">0</span>
            </button>
          </div>
        </div>
      </div>
    </section>

    <!-- CALENDAR -->
    <section class="view" id="view-cal">
      <div class="cal-header">
        <button id="prevMonth">‹</button>
        <div class="title" id="calTitle">2026年8月</div>
        <button id="nextMonth">›</button>
      </div>
      <div class="cal-grid" id="calDow"></div>
      <div class="cal-grid" id="calGrid" style="margin-top:6px;"></div>
      <div class="cal-stats" id="calStats"></div>
      <div id="calChart" style="margin-top:14px;"></div>
    </section>

    <!-- SETTINGS -->
    <section class="view" id="view-settings">
      <div class="card">
        <div class="field">
          <label>1箱あたりの本数</label>
          <div class="stepper">
            <button id="packSizeDec">−</button>
            <div class="n" id="packSizeSetting">20</div>
            <button id="packSizeInc">+</button>
          </div>
        </div>
        <div class="check-line">お使いのタバコ・電子タバコの1箱・1パッケージあたりの本数に合わせて設定してください。</div>
      </div>
      <div class="card">
        <div class="field">
          <label>1日の開始時間</label>
          <div class="stepper">
            <button id="dayStartDec">−</button>
            <div class="n" id="dayStartSetting">0:00</div>
            <button id="dayStartInc">+</button>
          </div>
        </div>
        <div class="check-line">この時刻より前は前日分として記録されます。例えば5:00にすると、深夜2時に吸った分は前日のカウントに加算されます。</div>
      </div>
      <div class="card">
        <div class="field">
          <label>1日の目標本数</label>
          <div class="stepper">
            <button id="goalDec">−</button>
            <div class="n" id="dailyGoalSetting">20</div>
            <button id="goalInc">+</button>
          </div>
        </div>
        <div class="check-line">目標本数を超えた日はカレンダーが赤くなります。0に
